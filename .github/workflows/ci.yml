# Builds both apps (Release|x64) and runs the headless preset self-tests.
#
# --roundtrip and --validate need no GL context (pure QCoreApplication) and
# are the load-bearing checks. --transcheck renders real OpenGL 4.3 core
# frames (PresetEditor requests 4.3, not 3.3, so its ComputeFX-backed 2D
# previews -- FractalFlame, PixelSort, SpectrumFilter, ... -- get a working
# compute pipeline instead of rendering black), which the hosted runner's
# GPU-less VM can't provide out of the box
# (its inbox opengl32.dll is a software OpenGL 1.1 driver only) -- Mesa's
# llvmpipe opengl32.dll is dropped next to the exe to stand in for it. That
# swap is best-effort: if it doesn't come up cleanly on a given runner image,
# the steps that need it are skipped; when it does, they gate (since 20.11.2026).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # 6.10.3 rather than the 6.11.x the project builds with locally: Qt 6.11's
  # Windows msvc2022_64 packages aren't published to aqt's public mirror yet
  # (confirmed via `aqt list-qt windows desktop --arch 6.11.x` -- 6.10.3 is
  # the newest version that actually resolves). Bump this once 6.11 lands
  # there; nothing in either app depends on a 6.11-only API.
  QT_VERSION: '6.10.3'
  MESA_VERSION: '26.2.0'

jobs:
  build-and-test:
    # GA image with Visual Studio 2026 (toolset v145, required by both
    # .vcxproj files) preinstalled -- see actions/runner-images.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # numpy for the analyzer and scene-plan checks (Tools/analyzer_regress.py, Tools/check_schedule.py).
      - name: Python packages
        shell: pwsh
        run: python -m pip install --quiet --disable-pip-version-check numpy

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # numpy for the analyzer and scene-plan checks (Tools/analyzer_regress.py, Tools/check_schedule.py).  After
      # "Install Qt": that action puts its own Python first on PATH, and pip must install into the one the steps run.
      - name: Python packages
        shell: pwsh
        run: python -m pip install --quiet --disable-pip-version-check numpy

      # QTDIR is what both .vcxproj files read for their include/lib paths;
      # install-qt-action exports QT_ROOT_DIR, not QTDIR, so it's passed
      # through explicitly.
      - name: Build Kaleidoscope (main app, Release x64)
        shell: pwsh
        # RunDeploy=false: the post-build packaging (deploy.ps1, Inno Setup) is the release's business; on the
        # runner its Inno Setup rejects installer.iss and fills the log with a failure that is none.
        run: msbuild Kaleidoscope.sln /p:Configuration=Release /p:Platform=x64 "/p:QTDIR=$env:QT_ROOT_DIR" /p:RunDeploy=false /m /v:minimal

      - name: Build PresetEditor (Release x64)
        shell: pwsh
        run: msbuild PresetEditor\PresetEditor.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:QTDIR=$env:QT_ROOT_DIR" /m /v:minimal

      # Static contract check for the shader tree.  Needs no GL and no build,
      # so it runs first: it catches the silent-black classes (unbound
      # attributes, missing camera transform, gl_PointCoord under
      # GL_TRIANGLES, the indirect draw-count contract, undeclared uniforms)
      # in a second, where finding them by rendering costs a full batch pass.
      # Validated against the commit that introduced them: it flags all 17
      # broken scenes there and is clean on the fixed tree.
      # --no-compile: the static rules only.  Since shadercheck also compiles every shader with the real driver
      # (rule C1, PresetEditor --compile), this step failed on the runner: its default OpenGL knows no GLSL 3.30,
      # so all 3200 shaders "did not compile" and the workflow was red from v1.18 on.  The real compile runs
      # further down, once the software OpenGL is installed.
      - name: Self-test -- shadercheck (shader engine contracts, no GL)
        shell: pwsh
        run: |
          python Tools\shadercheck.py --no-compile
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Both ends of the motion budget, and both are static.  The ceiling
      # stops a scene strobing; the floor catches the opposite failure, which
      # went unnoticed far longer: 987 camera-rig formulas sat three orders of
      # magnitude BELOW the 4 Hz ceiling, giving oscillation periods of half an
      # hour to five hours, so a 40-second scene panned by 0.8 degrees and 238
      # scenes read as still images.  Nothing watched for that until this
      # checker grew a lower bound.
      - name: Self-test -- temporal budget (strobe ceiling AND motion floor, no GL)
        shell: pwsh
        run: |
          python Tools\temporal_budget.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # A uniform declared float in GLSL but fed an int from the preset (or
      # vice versa) does not fail to compile -- it silently reads garbage.
      - name: Self-test -- uniform types (preset vs GLSL declaration, no GL)
        shell: pwsh
        run: |
          python Tools\check_uniform_types.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The Linux/macOS build (CMakeLists.txt) and the Qt Creator one
      # (Kaleidoscope.pro) list their sources by hand; nothing built them here,
      # so they fell weeks behind the vcxproj without anyone noticing.
      - name: Self-test -- build lists in step (vcxproj, CMake, .pro; no GL)
        shell: pwsh
        run: |
          python Tools\check_build_lists.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python Tools\check_settings_path.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-test -- enum/name tables stay in step (AudioLoc, ExprVars; no GL)
        shell: pwsh
        run: |
          python Tools\check_enum_tables.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The rest of release_check's "rules" step (Tools/release_check.py), which until 20.11.2026 ran only on the
      # reference machine: every UI text in both languages, the mood tags against their vocabulary, and no new
      # camera shake (rotation, zoom or position on an audio signal) against the accepted baseline.
      - name: Self-test -- UI strings, mood tags, camera shake (no GL)
        shell: pwsh
        run: |
          python Tools\check_strings.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python Tools\check_mood_tags.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python Tools\shake_scan.py --summary --baseline Tools\shake_baseline.tsv
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Every shader's documentation block in step with its uniforms, and the layout of C++ and GLSL after the
      # CGVR guidelines (clang-format from the Visual Studio LLVM toolset, as on the reference machine).
      - name: Self-test -- shader docs and source layout (no GL)
        shell: pwsh
        run: |
          python Tools\doc_shaders.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys; sys.path.insert(0, 'Tools'); import cgvr_format, subprocess; print(subprocess.run([cgvr_format.CLANG_FORMAT, '--version'], capture_output=True, text=True).stdout.strip())"
          python Tools\cgvr_format.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-test -- roundtrip (load+save every preset, no GL)
        shell: pwsh
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          $tmp = Join-Path $env:RUNNER_TEMP "roundtrip"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $failed = $false
          Get-ChildItem "Presets\*.xml" | ForEach-Object {
            $out = Join-Path $tmp $_.Name
            & $exe --roundtrip $_.FullName $out
            if ($LASTEXITCODE -ne 0) {
              Write-Error "roundtrip failed: $($_.Name)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Self-test -- validate (param completeness vs Komplett.xml, no GL)
        shell: pwsh
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --validate
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The app's own self test (Kaleidoscope.exe -q: score cues, analyzer and scheduler checks; no window).
      - name: Self-test -- Kaleidoscope.exe -q (no GL)
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          Push-Location Release
          $out = & .\Kaleidoscope.exe -q 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          $out -split "`n" | Select-Object -Last 15
          if ($code -ne 0 -or $out -notmatch '\d+ passed, 0 failed') { exit 1 }

      # The audio analysis against the synthetic tracks whose truth is known (chord changes, drops, tempo) and
      # against Tools/analyzer_baseline.json.  broadband120.wav is not in the repository; its checks run only on
      # the reference machine.
      - name: Self-test -- analyzer against its truth and baseline (no GL)
        shell: pwsh
        run: |
          $env:QTDIR = $env:QT_ROOT_DIR
          python Tools\analyzer_regress.py --allow-missing
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The scene plan of the genre presets, computed by the real scheduler on a virtual clock, against the
      # standing rules (solo ranges, fade floors, lab share, drops).
      - name: Self-test -- scene plan (check_schedule.py --quick, no GL)
        shell: pwsh
        run: |
          $env:QTDIR = $env:QT_ROOT_DIR
          python Tools\check_schedule.py --quick
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install software OpenGL (Mesa llvmpipe, for --transcheck)
        id: mesa
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          & "C:\Program Files\7-Zip\7z.exe" x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa\x64\opengl32.dll,mesa\x64\libgallium_wgl.dll -Destination "PresetEditor\build\Release\"

      # Gates since 20.11.2026: under Mesa all 210 transitions had passed for weeks, as on the reference machine.
      # Runs only with Mesa in place (a download hiccup must not turn the workflow red).
      - name: Self-test -- transcheck (all Transitions/*.frag, software GL)
        if: steps.mesa.outcome == 'success'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --transcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Every shader through a second GLSL compiler (Mesa), which is the one Linux users without the vendor's
      # driver have: the reference machine's NVIDIA compiler accepts things the standard does not.  Its first run
      # (10.11.2026) found four scenes with variables named `active`, `cast` and `mat2`; clean since, so it gates.
      - name: Self-test -- shader compile (every shader, Mesa's GLSL compiler)
        # only with Mesa in place: without it the runner's own OpenGL would fail every shader (a download hiccup
        # must not turn the workflow red)
        if: steps.mesa.outcome == 'success'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          python Tools\shadercheck.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Regression guard for the compute-FX 2D preview fix: renders
      # FractalFlame/ParticleFlow/SpectrumFilter/PixelMelt and fails if any
      # comes back solid black. Confirmed to actually catch a regression,
      # not just pass trivially: verified locally that forcing Mesa to GLSL
      # 3.3 (the pre-fix context request) makes ComputeFX's compute programs
      # fail to compile and this step correctly fails (ParticleFlow's
      # fallback is dark enough to trip it) -- on a real GPU the same
      # request doesn't reproduce the bug, since desktop drivers commonly
      # hand back a context above the requested minimum regardless, which is
      # exactly why this needs to run under the same software-GL path as
      # --transcheck rather than skipping straight to "looks fine locally".
      - name: Self-test -- cfxcheck (compute-FX 2D shaders not black, software GL)
        if: steps.mesa.outcome == 'success'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --cfxcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Startup smoke test for the MAIN app. Born from a real incident: a
      # pushed commit crashed Kaleidoscope.exe on launch (0xC0000005 --
      # uninitialised m_sh_prog_id read before the GL loader ran) and CI
      # stayed green because it only ever built the app, never started it.
      # The -x batch mode is the perfect probe: it analyses a WAV offline
      # (no audio device needed), drives the full startup path (config load,
      # GL 4.3 init, shader compiles, render+record loop) and exits by
      # itself.  Deliberately BLOCKING -- a startup crash must fail CI.
      # Skips only if the best-effort Mesa install above didn't deliver.
      - name: Smoke test -- main app starts, renders a WAV batch, exits (software GL)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          if (-not (Test-Path "mesa\x64\opengl32.dll")) {
            Write-Host "Mesa fehlt (best-effort Schritt) - Smoke-Test uebersprungen"
            exit 0
          }
          Copy-Item mesa\x64\opengl32.dll,mesa\x64\libgallium_wgl.dll -Destination "Release\"
          python -c "import wave,struct,math; w=wave.open('smoke.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); f=[struct.pack('<hh', *([int(12000*math.exp(-(t%11025)/1500.0)*math.sin(2*math.pi*55*t/44100)+6000*math.sin(2*math.pi*220*t/44100)*0.4)]*2)) for t in range(44100*2)]; w.writeframes(b''.join(f)); w.close()"
          # CWD must be Release\: the app resolves ..\Presets etc.
          # relative to its working directory (same layout as the dist zip).
          $wav = Join-Path (Get-Location) "smoke.wav"
          $p = Start-Process -FilePath "Release\Kaleidoscope.exe" -ArgumentList "-x","`"$wav`"","-l" -PassThru -WorkingDirectory "Release"
          $done = $p.WaitForExit(300000)
          if (-not $done) {
            Stop-Process -Id $p.Id -Force
            Write-Error "Smoke-Test: App nach 300 s nicht beendet (haengt)"
            if (Test-Path Release\kaleidoscope.log) { Get-Content Release\kaleidoscope.log -Tail 40 }
            exit 1
          }
          if (Test-Path Release\kaleidoscope.log) { Get-Content Release\kaleidoscope.log -Tail 25 }
          if ($p.ExitCode -ne 0) {
            Write-Error ("Smoke-Test: App-Startup fehlgeschlagen, ExitCode=0x{0:X}" -f $p.ExitCode)
            exit 1
          }
          Write-Host "Smoke-Test OK: App gestartet, WAV-Batch gerendert, sauber beendet."

  # ---------------------------------------------------------------------------------------------------------------
  # Linux (20.11.2026, docs/engine-internals-67-linux.md): three jobs beside the Windows one.
  #   linux        -- Ubuntu 24.04 with the distribution's Qt 6.4: the README's packages, cmake, the self test (-q)
  #                   a five-second video export, two preset switches over the web remote and a regular end, under
  #                   Xvfb with Mesa's llvmpipe.  A Linux build break, a failed self test or a run that does not end
  #                   cleanly turns the workflow red.
  #   appimage     -- Ubuntu 22.04, the oldest runner GitHub maintains (its glibc 2.35 is the floor the package needs),
  #                   with the distribution's Qt 6.2: Tools/appimage/build_appimage.sh; the AppImage is the artifact
  #                   Kaleidoscope-AppImage.  When ubuntu-22.04 leaves the runner images, build it in
  #                   `container: ubuntu:22.04` instead -- the glibc is what matters, not the runner.
  #   appimage-run -- a fresh ubuntu:24.04 container with an X server and Mesa but no Qt: the AppImage, as a normal
  #                   user, through Tools/appimage/test_appimage.sh (self test, the export, nothing written beside
  #                   the AppImage, settings/log/photos in the XDG folders, a preset read).
  # ---------------------------------------------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packages (the README's list; Xvfb, Mesa and ffmpeg to run it)
        run: |
          # The runner image rebuilds the man-page index after every install: minutes, for nothing here.
          sudo rm -f /var/lib/man-db/auto-update
          # The runner's mirror list (/etc/apt/apt-mirrors.txt, an EC2 mirror first) delivered 34 packages in 6.5
          # minutes on 20.11.2026, three runs in a row; Canonical's archive, which the container jobs use, took
          # seconds.  So the sources name it directly.
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources
          grep -h '^URIs' /etc/apt/sources.list.d/*.sources | sort -u
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-utils ffmpeg

      - name: Build (CMake, Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Self test (Kaleidoscope -q)
        working-directory: build
        run: |
          set +e
          xvfb-run -a ./Kaleidoscope -q > selftest.txt 2>&1
          code=$?
          set -e
          tail -n 15 selftest.txt
          [ "$code" -eq 0 ] && grep -Eq '[0-9]+ passed, 0 failed' selftest.txt

      - name: Export of five seconds (software GL)
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
        run: |
          python3 -c "import wave,struct,math; w=wave.open('../smoke.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh', *([int(12000*math.exp(-(t%11025)/1500.0)*math.sin(2*math.pi*55*t/44100)+2400*math.sin(2*math.pi*220*t/44100))]*2)) for t in range(44100*5))); w.close()"
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true
          export KALEIDO_SETTINGS="$RUNNER_TEMP/settings.ini"
          set +e
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -e ../smoke.wav -c Club -g 640x360 -p 30 -d "$RUNNER_TEMP/smoke.mp4" -l
          code=$?
          set -e
          tail -n 40 kaleidoscope.log || true
          echo "exit code $code"
          [ "$code" -eq 0 ]
          grep -E "^Presets: [1-9][0-9]* files read" kaleidoscope.log
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/smoke.mp4")
          echo "smoke.mp4: $dur s"
          python3 -c "import sys; d=float(sys.argv[1]); sys.exit(0 if 4.5 <= d <= 5.6 else 1)" "$dur"

      # A preset switch stops one RenderPipeline and starts another, which the export never does; the end through
      # KALEIDO_MAX_RUNTIME_SECS runs every destructor.  Both used to abort on Linux (QThread deleted while running).
      - name: Two preset switches over the web remote, then a regular end (software GL)
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
          KALEIDO_MAX_RUNTIME_SECS: '50'
        run: |
          export KALEIDO_SETTINGS="$RUNNER_TEMP/settings-switch.ini"
          xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -w ../smoke.wav -c Club -s 0.25 -t 18091 > switch.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:18091/api/state > /dev/null && break; sleep 1; done
          sleep 5
          for i in 0 1; do
            curl -fsS -H "X-Kaleido: 1" "http://127.0.0.1:18091/api/config?i=$i" > /dev/null   # an action needs the header
            sleep 8
            kill -0 "$pid" || { tail -n 40 switch.log; echo "the program ended at the switch to preset $i"; exit 1; }
            curl -fsS -o state.json http://127.0.0.1:18091/api/state && head -c 300 state.json; echo
          done
          set +e
          wait "$pid"
          code=$?
          set -e
          tail -n 15 switch.log
          echo "exit code $code"
          [ "$code" -eq 0 ]

  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packages (distribution Qt 6.2 of Ubuntu 22.04, the oldest maintained runner -- its glibc 2.35 is the floor)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev libqt6opengl6-dev qmake6 \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake file

      - name: Build the AppImage (linuxdeploy + Qt plugin)
        run: bash Tools/appimage/build_appimage.sh "$RUNNER_TEMP/dist"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Kaleidoscope-AppImage
          path: ${{ runner.temp }}/dist/Kaleidoscope-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  appimage-run:
    needs: appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    env:
      T: /opt/kaleido-test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (for the test script)
        uses: actions/checkout@v7

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: Kaleidoscope-AppImage
          path: /opt/kaleido-test/app

      - name: Install what a desktop has -- an X server, Mesa, fonts -- and no Qt
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libopengl0 libegl1 libgl1-mesa-dri libglx-mesa0 libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 fonts-dejavu-core file binutils
          if ls /usr/lib/x86_64-linux-gnu/ | grep -E '^libQt[56]'; then echo "Qt is installed - the test would prove nothing"; exit 1; fi
          echo "no Qt on the system"

      - name: Libraries the AppImage expects from the system (report)
        run: |
          chmod 755 "$T/app/Kaleidoscope-x86_64.AppImage"
          mkdir -p "$T/x" && cd "$T/x"
          "$T/app/Kaleidoscope-x86_64.AppImage" --appimage-extract > /dev/null
          find squashfs-root -type f \( -name '*.so*' -o -path '*/usr/bin/*' \) -exec sh -c 'file -b "$1" | grep -q ELF && echo "$1"' _ {} \; > elfs.txt
          echo "$(wc -l < elfs.txt) ELF files"
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" xargs -a elfs.txt ldd 2> /dev/null | grep "not found" | sort | uniq -c || echo "nothing missing"
          du -sh squashfs-root
          cd / && rm -rf "$T/x"

      - name: Self test and a 5-s export from the AppImage, as a normal user (software GL; nothing beside it, a preset read)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
          KALEIDO_APPIMAGE_ARGS: --appimage-extract-and-run
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg > /dev/null
          useradd -m tester
          mkdir -p "$T/work" && chown tester "$T/work"
          runuser -u tester -- bash Tools/appimage/test_appimage.sh "$T/app/Kaleidoscope-x86_64.AppImage" "$T/work"

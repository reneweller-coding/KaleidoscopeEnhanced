# Builds both apps (Release|x64) and runs the headless preset self-tests.
#
# --roundtrip and --validate need no GL context (pure QCoreApplication) and
# are the load-bearing checks. --transcheck renders real OpenGL 4.3 core
# frames (PresetEditor requests 4.3, not 3.3, so its ComputeFX-backed 2D
# previews -- FractalFlame, PixelSort, SpectrumFilter, ... -- get a working
# compute pipeline instead of rendering black), which the hosted runner's
# GPU-less VM can't provide out of the box
# (its inbox opengl32.dll is a software OpenGL 1.1 driver only) -- Mesa's
# llvmpipe opengl32.dll is dropped next to the exe to stand in for it. That
# swap is best-effort: if it doesn't come up cleanly on a given runner image,
# the step is allowed to fail without blocking the pipeline.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # 6.10.3 rather than the 6.11.x the project builds with locally: Qt 6.11's
  # Windows msvc2022_64 packages aren't published to aqt's public mirror yet
  # (confirmed via `aqt list-qt windows desktop --arch 6.11.x` -- 6.10.3 is
  # the newest version that actually resolves). Bump this once 6.11 lands
  # there; nothing in either app depends on a 6.11-only API.
  QT_VERSION: '6.10.3'
  MESA_VERSION: '26.2.0'

jobs:
  build-and-test:
    # GA image with Visual Studio 2026 (toolset v145, required by both
    # .vcxproj files) preinstalled -- see actions/runner-images.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # QTDIR is what both .vcxproj files read for their include/lib paths;
      # install-qt-action exports QT_ROOT_DIR, not QTDIR, so it's passed
      # through explicitly.
      - name: Build Kaleidoscope (main app, Release x64)
        shell: pwsh
        run: msbuild Kaleidoscope.sln /p:Configuration=Release /p:Platform=x64 "/p:QTDIR=$env:QT_ROOT_DIR" /m /v:minimal

      - name: Build PresetEditor (Release x64)
        shell: pwsh
        run: msbuild PresetEditor\PresetEditor.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:QTDIR=$env:QT_ROOT_DIR" /m /v:minimal

      # Static contract check for the shader tree.  Needs no GL and no build,
      # so it runs first: it catches the silent-black classes (unbound
      # attributes, missing camera transform, gl_PointCoord under
      # GL_TRIANGLES, the indirect draw-count contract, undeclared uniforms)
      # in a second, where finding them by rendering costs a full batch pass.
      # Validated against the commit that introduced them: it flags all 17
      # broken scenes there and is clean on the fixed tree.
      - name: Self-test -- shadercheck (shader engine contracts, no GL)
        shell: pwsh
        run: |
          python Tools\shadercheck.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Both ends of the motion budget, and both are static.  The ceiling
      # stops a scene strobing; the floor catches the opposite failure, which
      # went unnoticed far longer: 987 camera-rig formulas sat three orders of
      # magnitude BELOW the 4 Hz ceiling, giving oscillation periods of half an
      # hour to five hours, so a 40-second scene panned by 0.8 degrees and 238
      # scenes read as still images.  Nothing watched for that until this
      # checker grew a lower bound.
      - name: Self-test -- temporal budget (strobe ceiling AND motion floor, no GL)
        shell: pwsh
        run: |
          python Tools\temporal_budget.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # A uniform declared float in GLSL but fed an int from the preset (or
      # vice versa) does not fail to compile -- it silently reads garbage.
      - name: Self-test -- uniform types (preset vs GLSL declaration, no GL)
        shell: pwsh
        run: |
          python Tools\check_uniform_types.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-test -- roundtrip (load+save every preset, no GL)
        shell: pwsh
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          $tmp = Join-Path $env:RUNNER_TEMP "roundtrip"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $failed = $false
          Get-ChildItem "Configurations\*.xml" | ForEach-Object {
            $out = Join-Path $tmp $_.Name
            & $exe --roundtrip $_.FullName $out
            if ($LASTEXITCODE -ne 0) {
              Write-Error "roundtrip failed: $($_.Name)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Self-test -- validate (param completeness vs Komplett.xml, no GL)
        shell: pwsh
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --validate
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install software OpenGL (Mesa llvmpipe, for --transcheck)
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          & "C:\Program Files\7-Zip\7z.exe" x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa\x64\opengl32.dll,mesa\x64\libgallium_wgl.dll -Destination "PresetEditor\build\Release\"

      - name: Self-test -- transcheck (all Transitions/*.frag, software GL)
        shell: pwsh
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --transcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Regression guard for the compute-FX 2D preview fix: renders
      # FractalFlame/ParticleFlow/SpectrumFilter/PixelMelt and fails if any
      # comes back solid black. Confirmed to actually catch a regression,
      # not just pass trivially: verified locally that forcing Mesa to GLSL
      # 3.3 (the pre-fix context request) makes ComputeFX's compute programs
      # fail to compile and this step correctly fails (ParticleFlow's
      # fallback is dark enough to trip it) -- on a real GPU the same
      # request doesn't reproduce the bug, since desktop drivers commonly
      # hand back a context above the requested minimum regardless, which is
      # exactly why this needs to run under the same software-GL path as
      # --transcheck rather than skipping straight to "looks fine locally".
      - name: Self-test -- cfxcheck (compute-FX 2D shaders not black, software GL)
        shell: pwsh
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          $exe = "PresetEditor\build\Release\PresetEditor.exe"
          & $exe --cfxcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Startup smoke test for the MAIN app. Born from a real incident: a
      # pushed commit crashed Kaleidoscope.exe on launch (0xC0000005 --
      # uninitialised m_sh_prog_id read before the GL loader ran) and CI
      # stayed green because it only ever built the app, never started it.
      # The -x batch mode is the perfect probe: it analyses a WAV offline
      # (no audio device needed), drives the full startup path (config load,
      # GL 4.3 init, shader compiles, render+record loop) and exits by
      # itself.  Deliberately BLOCKING -- a startup crash must fail CI.
      # Skips only if the best-effort Mesa install above didn't deliver.
      - name: Smoke test -- main app starts, renders a WAV batch, exits (software GL)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
        run: |
          if (-not (Test-Path "mesa\x64\opengl32.dll")) {
            Write-Host "Mesa fehlt (best-effort Schritt) - Smoke-Test uebersprungen"
            exit 0
          }
          Copy-Item mesa\x64\opengl32.dll,mesa\x64\libgallium_wgl.dll -Destination "Release\"
          python -c "import wave,struct,math; w=wave.open('smoke.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); f=[struct.pack('<hh', *([int(12000*math.exp(-(t%11025)/1500.0)*math.sin(2*math.pi*55*t/44100)+6000*math.sin(2*math.pi*220*t/44100)*0.4)]*2)) for t in range(44100*2)]; w.writeframes(b''.join(f)); w.close()"
          # CWD must be Release\: the app resolves ..\Configurations etc.
          # relative to its working directory (same layout as the dist zip).
          $wav = Join-Path (Get-Location) "smoke.wav"
          $p = Start-Process -FilePath "Release\Kaleidoscope.exe" -ArgumentList "-x","`"$wav`"","-l" -PassThru -WorkingDirectory "Release"
          $done = $p.WaitForExit(300000)
          if (-not $done) {
            Stop-Process -Id $p.Id -Force
            Write-Error "Smoke-Test: App nach 300 s nicht beendet (haengt)"
            if (Test-Path Release\kaleidoscope.log) { Get-Content Release\kaleidoscope.log -Tail 40 }
            exit 1
          }
          if (Test-Path Release\kaleidoscope.log) { Get-Content Release\kaleidoscope.log -Tail 25 }
          if ($p.ExitCode -ne 0) {
            Write-Error ("Smoke-Test: App-Startup fehlgeschlagen, ExitCode=0x{0:X}" -f $p.ExitCode)
            exit 1
          }
          Write-Host "Smoke-Test OK: App gestartet, WAV-Batch gerendert, sauber beendet."

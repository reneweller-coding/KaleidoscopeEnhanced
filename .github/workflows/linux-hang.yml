# TEMPORARY (wt-linux only).  Ubuntu 24.04's Mesa 25.2.8 never finished compiling Scene2D/TwentyFourCellBreathing.frag
# (compile-all of Komplett stuck there 45 min, on both runners).  Job "one": that shader alone, as it is and with
# each of its two loops made non-unrollable.  Job "scan": all of Komplett, a shader that takes more than 90 s is
# written down and left out, until the rest compiles.  Deleted afterwards.
name: Linux hang hunt

on:
  push:
    branches: [wt-linux]

jobs:
  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [orig, fold, march]
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake > /dev/null
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri > /dev/null
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build -j"$(nproc)" 2>&1 | grep -E "error|Error" || true
          test -x build/Kaleidoscope
      - name: Preset tool
        run: |
          cat > "$RUNNER_TEMP/mkpreset.py" << 'EOF'
          import sys, xml.etree.ElementTree as ET
          src, dst, name, mode, arg = sys.argv[1:6]
          tree = ET.parse(src); r = tree.getroot()
          r.set('ConfigurationName', name)
          skip = set(a for a in arg.split(',') if a)
          for c in list(r):
              if c.tag != 'TextureShader':
                  continue
              f = c.get('file', '').replace('\\', '/').split('/')[-1]
              if (mode == 'only' and f != arg) or (mode == 'skip' and f in skip):
                  r.remove(c)
          tree.write(dst, encoding='utf-8', xml_declaration=True)
          print(name, sum(1 for c in r if c.tag == 'TextureShader'), 'scenes')
          EOF
      - name: TwentyFourCellBreathing alone (${{ matrix.variant }})
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_COMPILE_ALL: '1'
          KALEIDO_NO_PARALLEL_COMPILE: '1'
        run: |
          set +e
          f=../Scene2D/TwentyFourCellBreathing.frag
          case "${{ matrix.variant }}" in
            fold)  sed -i 's/for ( int i = 0; i < 6; ++i )/for ( int i = 0; i < 6 + int( min( audioLevel, 0.0 ) ); ++i )/' $f ;;
            march) sed -i 's/for ( int i = 0; i < 90; ++i )/for ( int i = 0; i < 90 + int( min( audioLevel, 0.0 ) ); ++i )/' $f ;;
          esac
          grep -n "for ( int i" $f
          python3 "$RUNNER_TEMP/mkpreset.py" ../Presets/Komplett.xml ../Presets/ZZOne.xml ZZOne only TwentyFourCellBreathing.frag
          export KALEIDO_SETTINGS="$RUNNER_TEMP/c.ini"
          xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -c ZZOne -t 0 -s 0.25 > raw.txt 2>&1 &
          w=$!
          start=$(date +%s)
          for i in $(seq 1 300); do
            kill -0 $w 2> /dev/null || break
            [ "$(grep -c '^COMPILEALL' raw.txt)" -ge 2 ] && break
            sleep 1
          done
          n=$(grep -c '^COMPILEALL' raw.txt)
          echo "variant ${{ matrix.variant }}: $([ $n -ge 2 ] && echo compiled || echo NOT compiled) after $(( $(date +%s) - start )) s"
          grep -E "^COMPILEALL|SHADER|error" raw.txt | head -n 8
          pkill -9 -x Kaleidoscope || true

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake > /dev/null
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri > /dev/null
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build -j"$(nproc)" 2>&1 | grep -E "error|Error" || true
          test -x build/Kaleidoscope
      - name: Every shader of Komplett; one that takes over 90 s is left out and named
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_COMPILE_ALL: '1'
          KALEIDO_NO_PARALLEL_COMPILE: '1'
        run: |
          set +e
          cat > "$RUNNER_TEMP/mkpreset.py" << 'EOF'
          import sys, xml.etree.ElementTree as ET
          src, dst, name, mode, arg = sys.argv[1:6]
          tree = ET.parse(src); r = tree.getroot()
          r.set('ConfigurationName', name)
          skip = set(a for a in arg.split(',') if a)
          for c in list(r):
              if c.tag != 'TextureShader':
                  continue
              f = c.get('file', '').replace('\\', '/').split('/')[-1]
              if (mode == 'only' and f != arg) or (mode == 'skip' and f in skip):
                  r.remove(c)
          tree.write(dst, encoding='utf-8', xml_declaration=True)
          print(name, sum(1 for c in r if c.tag == 'TextureShader'), 'scenes')
          EOF
          skip=""
          export KALEIDO_SETTINGS="$RUNNER_TEMP/c.ini"
          t_end=$(( $(date +%s) + 4200 ))
          for round in $(seq 1 12); do
            python3 "$RUNNER_TEMP/mkpreset.py" ../Presets/Komplett.xml ../Presets/ZZScan.xml ZZScan skip "$skip"
            xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -c ZZScan -t 0 -s 0.25 > raw$round.txt 2>&1 &
            w=$!
            last=""; since=$(date +%s); stuck=""
            while kill -0 $w 2> /dev/null && [ $(date +%s) -lt $t_end ]; do
              cur=$(grep '^COMPILEALL' raw$round.txt | tail -n 1)
              now=$(date +%s)
              if [ "$cur" != "$last" ]; then
                [ -n "$last" ] && [ $((now - since)) -ge 10 ] && echo "slow: $((now - since)) s $last"
                last=$cur; since=$now
              elif [ $((now - since)) -ge 90 ] && echo "$cur" | grep -q '\.frag\|\.comp'; then
                stuck=$(echo "$cur" | sed 's/.*[\\/]//')
                break
              fi
              sleep 1
            done
            if [ -n "$stuck" ]; then
              echo "round $round: $stuck did not finish in 90 s ($(grep -c '^COMPILEALL' raw$round.txt) compiled before it)"
              skip="$skip,$stuck"
              pkill -9 -x Kaleidoscope; sleep 2
              continue
            fi
            grep -E '^COMPILEALL done|^SHADERS:' raw$round.txt
            break
          done
          echo "left out: ${skip#,}"

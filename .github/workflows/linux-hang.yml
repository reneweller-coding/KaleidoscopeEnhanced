# TEMPORARY (wt-linux only): the freeze inside Mesa (libgallium, deep recursion) also comes without the background
# compile, from setShaders() -- so: every shader of Komplett compiled once under Ubuntu 24.04's Mesa 25.2.8, each with
# its time, to name the one(s) Mesa does not finish.  Deleted afterwards.
name: Linux hang hunt

on:
  push:
    branches: [wt-linux]

jobs:
  compile-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake > /dev/null
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri gdb > /dev/null
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build -j"$(nproc)" 2>&1 | grep -E "error|Error" || true
          test -x build/Kaleidoscope
      - name: Compile every shader of Komplett (KALEIDO_COMPILE_ALL), each timed
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
          KALEIDO_COMPILE_ALL: '1'
          KALEIDO_NO_PARALLEL_COMPILE: '1'
        run: |
          set +e
          export KALEIDO_SETTINGS="$RUNNER_TEMP/c.ini"
          xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -c Komplett -t 0 -s 0.25 > raw.txt 2>&1 &
          watcher=$!
          # Every second: the COMPILEALL line in progress and since when; a shader that takes 5 s or more is named.
          last=""; since=$(date +%s)
          for i in $(seq 1 2700); do
            kill -0 $watcher 2> /dev/null || break
            cur=$(grep '^COMPILEALL' raw.txt | tail -n 1)
            if [ "$cur" != "$last" ]; then
              now=$(date +%s); [ -n "$last" ] && [ $((now - since)) -ge 5 ] && echo "SLOW $((now - since)) s: $last"
              last=$cur; since=$now
            fi
            sleep 1
          done
          grep -E '^COMPILEALL done|^SHADERS:' raw.txt
          echo "COMPILEALL lines: $(grep -c '^COMPILEALL' raw.txt)"
          if kill -0 $watcher 2> /dev/null; then
            app=$(pgrep -x Kaleidoscope | head -n 1)
            echo "::error::not done after 45 min; in progress since $(( $(date +%s) - since )) s: $last"
            sudo gdb -p "$app" -batch -ex "thread apply 1 bt 8" -ex "thread apply 1 bt -12" 2>&1 | grep -E "^#" | cut -c1-200
            kill -9 "$app"
            exit 1
          fi

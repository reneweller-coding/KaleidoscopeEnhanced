# TEMPORARY (wt-linux only): the Linux jobs while they are being made to work, so that each push runs them without
# the twelve minutes of the Windows job.  They move into ci.yml when they are green; this file is then deleted.
name: Linux WIP

on:
  push:
    branches: [wt-linux]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packages (the README's list; Xvfb, Mesa and ffmpeg to run it)
        run: |
          # The runner image rebuilds the man-page index after every install: minutes, for nothing here.
          sudo rm -f /var/lib/man-db/auto-update
          # The runner's first mirror (an EC2 one) delivered 34 packages in 6.5 minutes on 20.11.2026, twice; the
          # Azure and Canonical mirrors go first now, the runner's own list stays behind them.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            { printf 'http://azure.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n'; cat /etc/apt/apt-mirrors.txt; } > "$RUNNER_TEMP/mirrors.txt"
            sudo cp "$RUNNER_TEMP/mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-utils ffmpeg

      - name: Build (CMake, Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Self test (Kaleidoscope -q)
        working-directory: build
        run: |
          set +e
          xvfb-run -a ./Kaleidoscope -q > selftest.txt 2>&1
          code=$?
          set -e
          tail -n 15 selftest.txt
          [ "$code" -eq 0 ] && grep -Eq '[0-9]+ passed, 0 failed' selftest.txt

      - name: Export of five seconds (software GL)
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
        run: |
          python3 -c "import wave,struct,math; w=wave.open('../smoke.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh', *([int(12000*math.exp(-(t%11025)/1500.0)*math.sin(2*math.pi*55*t/44100)+2400*math.sin(2*math.pi*220*t/44100))]*2)) for t in range(44100*5))); w.close()"
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true
          export KALEIDO_SETTINGS="$RUNNER_TEMP/settings.ini"
          set +e
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./Kaleidoscope -e ../smoke.wav -c Club -g 640x360 -p 30 -d "$RUNNER_TEMP/smoke.mp4" -l
          code=$?
          set -e
          tail -n 40 kaleidoscope.log || true
          echo "exit code $code"
          [ "$code" -eq 0 ]
          grep -E "^Presets: [1-9][0-9]* files read" kaleidoscope.log
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/smoke.mp4")
          echo "smoke.mp4: $dur s"
          python3 -c "import sys; d=float(sys.argv[1]); sys.exit(0 if 4.5 <= d <= 5.6 else 1)" "$dur"

  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packages (distribution Qt 6.2 of Ubuntu 22.04, the oldest maintained runner -- its glibc 2.35 is the floor)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            { printf 'http://azure.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n'; cat /etc/apt/apt-mirrors.txt; } > "$RUNNER_TEMP/mirrors.txt"
            sudo cp "$RUNNER_TEMP/mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev libqt6opengl6-dev qmake6 \
                                  libgl1-mesa-dev libglu1-mesa-dev libpulse-dev cmake file

      - name: Build the AppImage (linuxdeploy + Qt plugin)
        run: bash Tools/appimage/build_appimage.sh "$RUNNER_TEMP/dist"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Kaleidoscope-AppImage
          path: ${{ runner.temp }}/dist/Kaleidoscope-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  appimage-run:
    needs: appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    env:
      T: /opt/kaleido-test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (for the test script)
        uses: actions/checkout@v7

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: Kaleidoscope-AppImage
          path: /opt/kaleido-test/app

      - name: Install what a desktop has -- an X server, Mesa, fonts -- and no Qt
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libopengl0 libegl1 libgl1-mesa-dri libglx-mesa0 libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 fonts-dejavu-core file binutils
          if ls /usr/lib/x86_64-linux-gnu/ | grep -E '^libQt[56]'; then echo "Qt is installed - the test would prove nothing"; exit 1; fi
          echo "no Qt on the system"

      - name: Libraries the AppImage expects from the system (report)
        run: |
          chmod 755 "$T/app/Kaleidoscope-x86_64.AppImage"
          mkdir -p "$T/x" && cd "$T/x"
          "$T/app/Kaleidoscope-x86_64.AppImage" --appimage-extract > /dev/null
          find squashfs-root -type f \( -name '*.so*' -o -path '*/usr/bin/*' \) -exec sh -c 'file -b "$1" | grep -q ELF && echo "$1"' _ {} \; > elfs.txt
          echo "$(wc -l < elfs.txt) ELF files"
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" xargs -a elfs.txt ldd 2> /dev/null | grep "not found" | sort | uniq -c || echo "nothing missing"
          du -sh squashfs-root
          cd / && rm -rf "$T/x"

      - name: Self test and a 5-s export from the AppImage, as a normal user (software GL; nothing beside it, a preset read)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.3'
          MESA_GLSL_VERSION_OVERRIDE: '430'
          KALEIDO_SEED: '1'
          KALEIDO_APPIMAGE_ARGS: --appimage-extract-and-run
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg > /dev/null
          useradd -m tester
          mkdir -p "$T/work" && chown tester "$T/work"
          runuser -u tester -- bash Tools/appimage/test_appimage.sh "$T/app/Kaleidoscope-x86_64.AppImage" "$T/work"
